<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yui — AI Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />

    <!-- Import map: resolve three.js module specifiers to local node_modules files. -->
    <!-- Electron can load file:// paths via importmap in the renderer process. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.min.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-shell">

      <!-- Center: Avatar Stage -->
      <section class="avatar-stage">
        <!-- Pose controls pinned to top-right of stage -->
        <nav class="pose-controls" aria-label="Pose animations">
          <button class="pose-button" id="poseBtn1" type="button" data-pose="pose-1" disabled title="Pose animations coming soon">Pose 1</button>
          <button class="pose-button" id="poseBtn2" type="button" data-pose="pose-2" disabled title="Pose animations coming soon">Pose 2</button>
          <button class="pose-button" id="poseBtn3" type="button" data-pose="pose-3" disabled title="Pose animations coming soon">Pose 3</button>
        </nav>

        <!-- 3D avatar canvas — replaces the old video elements -->
        <main class="stage">
          <canvas id="avatar-canvas"></canvas>
        </main>

        <!-- Status pill at bottom-left -->
        <div class="avatar-status-pill" id="avatar-status-pill">
          <span class="status-dot"></span>
          <span class="status-label" id="tts-status">Ready.</span>
        </div>
      </section>

      <!-- Right: Chat Panel -->
      <aside class="chat-panel">
        <div class="chat-header">
          <div class="chat-header-info">
            <div class="chat-title">Yui</div>
            <div class="chat-subtitle">AI Companion</div>
          </div>
          <div class="chat-online-badge">
            <span class="online-dot"></span>
            Online
          </div>
        </div>

        <div class="chat-messages" id="chat-log" aria-live="polite"></div>

        <form class="tts-form chat-input-row" autocomplete="off">
          <input
            id="tts-input"
            type="text"
            class="chat-input"
            placeholder="Type a message..."
            aria-label="Chat message"
          />
          <button id="tts-button" class="chat-send-btn" type="submit" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </aside>

    </div>

    <!-- 3D Avatar module — must load before renderer.js so window.avatar3d is set. -->
    <script type="module" src="src/avatar/avatar-init.js"></script>

    <!-- Renderer script for UI/chat/TTS logic -->
    <script src="renderer.js"></script>
  </body>
</html>
