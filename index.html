<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant [Yui]</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main stage for the idle animation videos -->
    <main class="stage">
      <video
        class="idle-video idle-video--a"
        autoplay
        muted
        playsinline
        preload="auto"
      ></video>
      <video
        class="idle-video idle-video--b"
        autoplay
        muted
        playsinline
        preload="auto"
      ></video>
    </main>

    <!-- Pose animation buttons -->
    <nav class="pose-controls" aria-label="Pose animations">
      <button class="pose-button" id="poseBtn1" type="button" data-pose="pose-1">
        Pose 1
      </button>
      <button class="pose-button" id="poseBtn2" type="button" data-pose="pose-2">
        Pose 2
      </button>
      <button class="pose-button" id="poseBtn3" type="button" data-pose="pose-3">
        Pose 3
      </button>
    </nav>

    <!-- Simple text-to-speech controls -->
    <section class="controls">
      <div class="chat-log" id="chat-log" aria-live="polite"></div>
      <form class="tts-form" autocomplete="off">
        <input
          id="tts-input"
          type="text"
          placeholder="Type a message"
          aria-label="Chat message"
        />
        <button id="tts-button" type="submit">Send</button>
      </form>
      <p class="tts-status" id="tts-status">Ready.</p>
    </section>

    <!-- Renderer script for UI logic -->
    <script src="renderer.js"></script>
  </body>
</html>
